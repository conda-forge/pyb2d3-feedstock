context:
  name: pyb2d3
  version: "1.0.0"

recipe:
  name: pyb2d3
  version: ${{ version }}

source:
  url: https://github.com/DerThorsten/${{ name }}/archive/refs/tags/v${{ version }}.tar.gz
  sha256: c3d3b4da6d8ab49946f290ff4ab864b9c0143c82d81df7f893ab03a0e4162cd9


build:
  number: 0

outputs:
  - package:
      name: pyb2d3
      version: ${{ version }}

    build:
      skip:
          - match(python, "<3.12")
      script: ${{ PYTHON }} -m pip install . --no-deps -vv  --config-settings=cmake.define.FETCH_BOX2D=OFF --config-settings=cmake.define.Python_EXECUTABLE=${{ PYTHON }}

    requirements:
      build:
        - if: build_platform != target_platform
          then:
            - python
            - cross-python_${{ target_platform }}
            - numpy
            - scikit-build-core
            - pip
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake
        - ninja
        - if: not win
          then:
            - make
        - nanobind
        - setuptools
      host:
        - if: build_platform == target_platform
          then:
            - pip
            - scikit-build-core
            - nanobind
            - setuptools
        - python
        - numpy
        - box2d ==3.2.0
      run:
        - python
        - numpy
  
    tests:
      - python:
          imports:
            - pyb2d3
          pip_check: true

about:
  summary: "Python bindings for Box2D using nanobind."
  description: |
    pyb2d3 is a Python package that provides high-performance bindings to the Box2D physics engine using nanobind and scikit-build-core.
  homepage: https://github.com/DerThorsten/pyb2d3
  repository: https://github.com/DerThorsten/pyb2d3
  license: MIT
  license_file:
    - LICENSE
    - extra_licenses/LICENSE_NANOBIND

extra:
  feedstock-name: pyb2d3
  recipe-maintainers:
    - DerThorsten
